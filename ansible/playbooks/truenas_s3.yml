---
# Needs group_vars/all/secrets.yml
- name: SeaweedFS S3 on TrueNAS LXC host
  hosts: truenas_s3
  become: false
  gather_facts: true
  roles:
    - docker
  tasks:
    - name: Check that the TrueNAS dataset is mounted
      ansible.builtin.assert:
        that: seaweedfs_data_dir in (ansible_facts['mounts'] | map(attribute='mount'))
        fail_msg: "{{ seaweedfs_data_dir }} is not a mount point; attach the TrueNAS dataset to the LXC first."
        quiet: true

    # uid/gid 1000 is the 'seaweed' user the image's entrypoint drops to.
    - name: Create SeaweedFS data directories
      ansible.builtin.file:
        path: "{{ seaweedfs_data_dir }}/{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"
      loop:
        - master
        - volume
        - filer

    - name: Create certificate directory
      ansible.builtin.file:
        path: "{{ seaweedfs_data_dir }}/letsencrypt"
        state: directory
        mode: "0700"

    - name: Create stack directory
      ansible.builtin.file:
        path: "{{ seaweedfs_stack_dir }}"
        state: directory
        mode: "0755"

    - name: Template S3 credentials
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../compose/seaweedfs/s3.json.j2"
        dest: "{{ seaweedfs_stack_dir }}/s3.json"
        owner: "1000"
        group: "1000"
        mode: "0600"
      diff: false
      notify: Restart SeaweedFS S3

    - name: Write Cloudflare credentials for certbot
      ansible.builtin.copy:
        content: "dns_cloudflare_api_token = {{ cloudflare_dns_api_token }}\n"
        dest: "{{ seaweedfs_stack_dir }}/cloudflare.ini"
        mode: "0600"
      diff: false

    - name: Template nginx config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../compose/seaweedfs/nginx.conf.j2"
        dest: "{{ seaweedfs_stack_dir }}/nginx.conf"
        mode: "0644"
      notify: Restart SeaweedFS nginx

    # nginx needs a certificate to start; the certbot service renews it later.
    - name: Issue initial TLS certificate
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ seaweedfs_data_dir }}/letsencrypt:/etc/letsencrypt"
          - -v
          - "{{ seaweedfs_stack_dir }}/cloudflare.ini:/cloudflare.ini:ro"
          - "certbot/dns-cloudflare:{{ seaweedfs_certbot_version }}"
          - certonly
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ seaweedfs_acme_email }}"
          - --dns-cloudflare
          - --dns-cloudflare-credentials
          - /cloudflare.ini
          - --dns-cloudflare-propagation-seconds
          - "30"
          - --cert-name
          - seaweedfs
          - -d
          - "{{ seaweedfs_data_fqdn }}"
          - -d
          - "{{ seaweedfs_mgmt_fqdn }}"
        creates: "{{ seaweedfs_data_dir }}/letsencrypt/live/seaweedfs/fullchain.pem"

    - name: Deploy compose stack
      ansible.builtin.import_role:
        name: compose_service

  handlers:
    - name: Restart SeaweedFS S3
      community.docker.docker_compose_v2:
        project_src: "{{ seaweedfs_stack_dir }}"
        services:
          - s3
        state: restarted

    - name: Restart SeaweedFS nginx
      community.docker.docker_compose_v2:
        project_src: "{{ seaweedfs_stack_dir }}"
        services:
          - nginx
        state: restarted
