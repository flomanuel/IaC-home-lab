---
- name: Setup for Kubernetes Control Nodes
  hosts: k8s_control
  become: true
  roles:
    - k8s_base
    - k8s_etcd_disk
  gather_facts: true
  serial: 1
  vars:
    VIP: "tls_san_vip"
    INTERFACE: "eth0"
    KVVERSION: "v1.2.4"
    CTR: "/var/lib/rancher/k3s/data/current/bin/ctr"
    CONTAINERD_SOCK: "/run/k3s/containerd/containerd.sock"
    KV_MANIFEST: "/var/lib/rancher/k3s/server/manifests/kube-vip-manifest.yml"
  tasks:
    # https://github.com/alexellis/k3sup#k3sup-community-edition-ce
    - name: Run k3sup (server)
      shell: |
        k3sup install \
          --ip {{k3s_server}} \
          --k3s-extra-args '--tls-san {{tls_san_vip}}' \
          --k3s-extra-args '--tls-san {{tls_san_vip_dns}}' \
          --k3s-extra-args '--disable servicelb' \
          --k3s-extra-args '--disable traefik' \
          --cluster \
          --k3s-version {{k3s_version}} \
          --k3s-channel stable \
          --user {{ansible_user}} \
          --local-path $HOME/.kube/config \
          --merge \
          --context {{kubeconfig_context}}
      delegate_to: localhost
      become: false
    # https://kube-vip.io/docs/installation/daemonset/
    - name: Add kube-vip as a DaemonSet for all control plane nodes
      shell: kubectl apply -f https://kube-vip.io/manifests/rbac.yaml
    - name: pull kube-vip images
      shell: "{{CTR}} --address {{CONTAINERD_SOCK}} --namespace k8s.io image pull ghcr.io/kube-vip/kube-vip:{{KVVERSION}}"
    - name: ???
      shell: alias kube-vip="{{CTR}} --address {{CONTAINERD_SOCK}} --namespace k8s.io run --rm --net-host ghcr.io/kube-vip/kube-vip:{{KVVERSION}} vip /kube-vip"
    - name: "Create the DaemonSet manifest"
      shell: |
        kube-vip manifest daemonset \
            --interface {{INTERFACE}} \
            --address {{VIP}} \
            --inCluster \
            --taint \
            --controlplane \
            --services \
            --arp \
            --leaderElection > {{ KV_MANIFEST }}
    - name: Apply the DaemonSet manifest
      shell: kubectl apply -f {{ KV_MANIFEST }}
  post_tasks:
    - name: Read the kube-vip DaemonSet manifest
      slurp:
        src: "{{ KV_MANIFEST }}"
      register: kv_manifest_raw
    - name: Ensure svc_enable is set to "true" in the kube-vip DaemonSet manifest
      vars:
        svc_enable_values: >-
          {{ (kv_manifest_raw.content | b64decode | from_yaml).spec.template.spec.containers
             | map(attribute='env', default=[]) | flatten
             | selectattr('name', 'equalto', 'svc_enable')
             | map(attribute='value', default='') | map('string') | list }}
      assert:
        that:
          - svc_enable_values | length > 0
          - svc_enable_values | reject('equalto', 'true') | list | length == 0
        fail_msg: >-
          {{ KV_MANIFEST }} must contain env entry 'svc_enable' with value "true",
          found: {{ svc_enable_values if svc_enable_values else 'no svc_enable entry' }}
        success_msg: "svc_enable is set to \"true\" in {{ KV_MANIFEST }}"
