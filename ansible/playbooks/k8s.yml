---
# Control nodes first: the workers join the server set up by the first play.
- name: Setup for Kubernetes Control Nodes
  hosts: k8s_control
  become: true
  roles:
    - { role: base, tags: base }
    - { role: nfs_mounts, tags: nfs }
    - { role: k8s_base, tags: k8s }
    - { role: k8s_etcd_disk, tags: k8s }
  gather_facts: true
  serial: 1
  vars:
    VIP: "{{ tls_san_vip }}"
    INTERFACE: "eth0"
    KVVERSION: "v1.2.4"
    CTR: "/var/lib/rancher/k3s/data/current/bin/ctr"
    CONTAINERD_SOCK: "/run/k3s/containerd/containerd.sock"
    KV_MANIFEST: "/var/lib/rancher/k3s/server/manifests/kube-vip-manifest.yml"
    # --k3s-extra-args is a single string flag (last one wins), so all args go into one value.
    # Must be identical on all servers.
    K3S_EXTRA_ARGS: "--tls-san {{ tls_san_vip }} --tls-san {{ tls_san_vip_dns }} --disable servicelb --disable traefik"
  tasks:
    - name: Install K3s and kube-vip
      tags: k3s
      block:
        # https://github.com/alexellis/k3sup#k3sup-community-edition-ce
        - name: Run k3sup (initial server)
          ansible.builtin.shell: |
            k3sup install \
              --ip {{ hostvars[inventory_hostname]['ansible_host'] }} \
              --k3s-extra-args '{{ K3S_EXTRA_ARGS }}' \
              --cluster \
              --k3s-version {{k3s_version}} \
              --k3s-channel stable \
              --user {{ansible_user}} \
              --local-path $HOME/.kube/config \
              --merge \
              --context {{kubeconfig_context}}
          delegate_to: localhost
          become: false
          when: inventory_hostname == groups['k8s_control'][0]
        - name: Run k3sup (join additional server)
          ansible.builtin.shell: |
            k3sup join \
              --ip {{ hostvars[inventory_hostname]['ansible_host'] }} \
              --server \
              --server-ip {{k3s_server}} \
              --user {{ansible_user}} \
              --k3s-channel stable \
              --k3s-version {{k3s_version}}
          #    --k3s-extra-args '{{ K3S_EXTRA_ARGS }}'
          delegate_to: localhost
          become: false
          when: inventory_hostname != groups['k8s_control'][0]

        # https://kube-vip.io/docs/installation/daemonset/
        - name: Add kube-vip RBAC
          ansible.builtin.shell: kubectl apply -f https://kube-vip.io/manifests/rbac.yaml
        - name: pull kube-vip images
          ansible.builtin.shell: "{{CTR}} --address {{CONTAINERD_SOCK}} --namespace k8s.io image pull ghcr.io/kube-vip/kube-vip:{{KVVERSION}}"
        - name: "Create the DaemonSet manifest"
          ansible.builtin.shell: |
            {{CTR}} --address {{CONTAINERD_SOCK}} --namespace k8s.io \
              run --rm --net-host ghcr.io/kube-vip/kube-vip:{{KVVERSION}} vip \
              /kube-vip manifest daemonset \
                --interface {{INTERFACE}} \
                --address {{VIP}} \
                --inCluster \
                --taint \
                --controlplane \
                --services \
                --arp \
                --leaderElection > {{ KV_MANIFEST }}
        - name: Apply the DaemonSet manifest
          ansible.builtin.shell: kubectl apply -f {{ KV_MANIFEST }}
  post_tasks:
    - name: Verify the kube-vip DaemonSet manifest
      tags: k3s
      block:
        - name: Read the kube-vip DaemonSet manifest
          ansible.builtin.slurp:
            src: "{{ KV_MANIFEST }}"
          register: kv_manifest_raw
        - name: Ensure svc_enable is set to "true" in the kube-vip DaemonSet manifest
          vars:
            svc_enable_values: >-
              {{ (kv_manifest_raw.content | b64decode | from_yaml).spec.template.spec.containers
                 | map(attribute='env', default=[]) | flatten
                 | selectattr('name', 'equalto', 'svc_enable')
                 | map(attribute='value', default='') | map('string') | list }}
          assert:
            that:
              - svc_enable_values | length > 0
              - svc_enable_values | reject('equalto', 'true') | list | length == 0
            fail_msg: >-
              {{ KV_MANIFEST }} must contain env entry 'svc_enable' with value "true",
              found: {{ svc_enable_values if svc_enable_values else 'no svc_enable entry' }}
            success_msg: 'svc_enable is set to "true" in {{ KV_MANIFEST }}'

- name: Setup for Kubernetes Worker Nodes
  hosts: k8s_worker
  become: true
  roles:
    - { role: base, tags: base }
    - { role: nfs_mounts, tags: nfs }
    - { role: k8s_base, tags: k8s }
  gather_facts: true
  tasks:
    - name: Run k3sup (agent)
      ansible.builtin.shell: |
        k3sup join \
          --ip {{ hostvars[inventory_hostname]['ansible_host'] }} \
          --server-ip {{k3s_server}} \
          --user {{ansible_user}} \
          --k3s-version {{k3s_version}} \
          --k3s-channel stable
      delegate_to: localhost
      become: false
      tags: k3s
