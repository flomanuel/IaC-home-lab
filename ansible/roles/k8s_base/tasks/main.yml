---
- name: Install packages
  apt:
    name: "{{ k8s_packages }}"
    state: present
    update_cache: true

- name: Ensure kernel modules load at boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      {% for module in k8s_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Load kernel modules now
  command: "modprobe {{ item }}"
  loop: "{{ k8s_kernel_modules }}"
  changed_when: false

- name: Configure sysctl settings for Kubernetes
  copy:
    dest: /etc/sysctl.d/90-k8s.conf
    mode: "0644"
    src: 90-k8s.conf
  notify: apply sysctl

- name: Disable swap for current session
  command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: ansible_facts.swaptotal_mb | int > 0

- name: Disable swap permanently (comment out swap entries)
  replace:
    path: /etc/fstab
    regexp: '^([^#\n]*\sswap\s.*)$'
    replace: '#\1'

