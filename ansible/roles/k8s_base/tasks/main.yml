---
- name: Install packages
  ansible.builtin.apt:
    name: "{{ k8s_packages }}"
    state: present
    update_cache: true
- name: Disable swap for current session
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: ansible_facts.swaptotal_mb | int > 0
- name: Disable swap permanently (comment out swap entries)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]*\sswap\s.*)$'
    replace: '#\1'
