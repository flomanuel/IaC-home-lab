---
- name: Apply kernel parameters
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-kubelet.conf
  changed_when: true

# Skipped on a fresh install: k3sup starts K3s with the hardening config already in place.
- name: Restart k3s
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if inventory_hostname in groups['k8s_control'] else 'k3s-agent' }}"
    state: restarted
  when: k8s_hardening_k3s_binary.stat.exists
