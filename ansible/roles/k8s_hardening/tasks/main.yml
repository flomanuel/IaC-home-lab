---
# Runs before k3sup so that K3s starts hardened on first boot.
# See https://docs.k3s.io/security/hardening-guide
- name: Check whether K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k8s_hardening_k3s_binary

- name: Harden all nodes
  ansible.builtin.include_tasks: common.yml

- name: Harden control plane nodes
  ansible.builtin.include_tasks: server.yml
  when: inventory_hostname in groups['k8s_control']
