---
compose_services: [] # do not forget to add to backup_sources
# Stacks deployed on every host (e.g. backup).
compose_services_always: []

# Always-on compose goes last. Thus, dirs from other stacks already exist.
compose_stacks: "{{ compose_services + (compose_services_always | difference(compose_services)) }}"

compose_dest_root: /opt
# Where the compose templates live in the repo (ansible/compose/<name>/compose.yml.j2)
compose_src_dir: "{{ playbook_dir }}/../compose"
