---
# Formats and mounts the dedicated SSD disk (tofu `data_disks`) for the K3s etcd datastore.
# Must run before K3s is installed, otherwise K3s writes its db to the OS disk.
# Looked up by serial, as udev's /dev/disk/by-id link uses the Proxmox drive name (drive-scsiN), not the serial.
- name: Find the etcd disk by its serial
  shell: lsblk -dnpo NAME,SERIAL | awk '$2 == "{{ k8s_etcd_disk_serial }}" { print $1 }'
  register: k8s_etcd_disk_device
  changed_when: false
  check_mode: false

- name: Fail unless exactly one etcd disk is found
  assert:
    that: k8s_etcd_disk_device.stdout_lines | length == 1
    fail_msg: "Expected one disk with serial '{{ k8s_etcd_disk_serial }}', found {{ k8s_etcd_disk_device.stdout_lines }}. Is the data disk attached in tofu?"
    quiet: true

# Whole disk, no partition table. Never reformats a disk that already has a filesystem.
- name: Create filesystem on the etcd disk
  community.general.filesystem:
    dev: "{{ k8s_etcd_disk_device.stdout }}"
    fstype: "{{ k8s_etcd_disk_fstype }}"
    opts: "-m 0 -L {{ k8s_etcd_disk_serial }}"

- name: Read the filesystem UUID
  command: "blkid -s UUID -o value {{ k8s_etcd_disk_device.stdout }}"
  register: k8s_etcd_disk_uuid
  changed_when: false

- name: Mount the etcd disk
  ansible.posix.mount:
    src: "UUID={{ k8s_etcd_disk_uuid.stdout }}"
    path: "{{ k8s_etcd_disk_mount_path }}"
    fstype: "{{ k8s_etcd_disk_fstype }}"
    opts: "{{ k8s_etcd_disk_mount_opts }}"
    state: mounted

# Applies to the root of the mounted filesystem, not the underlying directory.
- name: Restrict permissions on the mounted etcd directory
  file:
    path: "{{ k8s_etcd_disk_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
