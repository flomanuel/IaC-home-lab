---
- name: Install package
  ansible.builtin.apt:
    name: "{{ template_service_package }}"
    state: present

# TODO: add config templating here, e.g.:
# - name: Template config
#   ansible.builtin.template:
#     src: config.j2
#     dest: /etc/changeme/config
#     mode: "0644"
#   notify: Restart service

- name: Enable service
  ansible.builtin.service:
    name: "{{ template_service_name }}"
    state: started
    enabled: true
