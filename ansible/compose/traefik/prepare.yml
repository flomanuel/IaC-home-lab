---
# Included by roles/compose_service before `docker compose up`.
- name: Traefik create config directory
  ansible.builtin.file:
    path: "{{ compose_dest_root }}/traefik/config"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Traefik create data directory
  ansible.builtin.file:
    path: "{{ compose_dest_root }}/traefik/data"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Traefik create secrets directory
  ansible.builtin.file:
    path: "{{ compose_dest_root }}/traefik/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: traefik config file
  ansible.builtin.copy:
    src: traefik.yml
    dest: "{{ compose_dest_root }}/traefik/config/traefik.yml"

- name: Traefik write secret files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ compose_dest_root }}/traefik/secrets/{{ item.name }}"
  loop:
    - {
        name: cloudflare_dns_api_token,
        value: "{{ cloudflare_dns_api_token }}",
      }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
