---
# Application stacks are deployed by Dockhand from stacks/ in the repo root, NOT by Ansible.
# Ansible only bootstraps the management plane (ansible/compose/<name>/compose.yml.j2):
# dockhand on debian-01, a hawser agent on every other docker host. Set per host in host_vars.
compose_services: []

# Shared docker networks, created before any stack runs. Stacks join them as
# `external: true`, so stacks do not depend on each other's deploy order.
docker_networks:
  - frontend # traefik

# Add admin_user to the docker group (docker CLI without sudo).
docker_admin_in_group: true

# Management plane versions. Bump here, then `just play docker_hosts --tags compose`.
dockhand_version: v1.0.49 # https://hub.docker.com/r/fnsys/dockhand/tags
hawser_version: "0.2.50" # https://github.com/Finsys/hawser/releases

# Dockhand drops to this uid/gid (Owner of /opt/dockhand/data)
dockhand_puid: 1000
