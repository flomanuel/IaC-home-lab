---
# Must match vm_user in tofu (cloud-init creates this user).
admin_user: admin
ansible_user: "{{ admin_user }}"

timezone: Europe/Berlin

# truenas_data_ip comes from group_vars/all/secrets.yml (gitignored).

base_packages:
  - vim
  - nano
  - htop
  - curl
  - rsync
  - tmux

# NFS mounts from TrueNAS; override per group/host. The VM needs a NIC in the
# "data" VLAN (tofu networks list) to reach these. Example:
# nfs_mounts:
#   - src: "{{ truenas_data_ip }}:/mnt/tank/media"
#     path: /mnt/media
nfs_mounts: []
