# DBs, secrets, docker compose; runs Dockhand (manages all docker hosts)
data_ip: "{{ debian01_data_ip }}"
mgmt_ip: "{{ debian01_mgmt_ip }}"
docker_networks:
  - frontend
  - postgres
compose_services:
  - dockhand
# Dedicated SSD for postgres (role data_disks), serial must match the tofu `data_disks`.
# Mount root stays root:root 0755 (it holds lost+found); the stack bind-mounts
# /srv/postgres/data, which the postgres entrypoint creates and chowns.
data_disks:
  - serial: postgres-data
    mount_path: /srv/postgres
