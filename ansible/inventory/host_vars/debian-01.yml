# DBs, secrets, docker compose; runs Dockhand (manages all docker hosts)
data_ip: "{{ debian01_data_ip }}"
mgmt_ip: "{{ debian01_mgmt_ip }}"
docker_networks:
  - frontend
  - postgres
compose_services:
  - dockhand
# Dedicated SSD for postgres (role data_disks), serial must match the tofu `data_disks`.
# Mount root stays root:root 0755 (it holds lost+found); the stack bind-mounts
# /srv/postgres/data, which the postgres entrypoint creates and chowns.
data_disks:
  - serial: postgres-data
    mount_path: /srv/postgres
nfs_mounts:
  # Jellyfin readonly AUDIO
  - src: "{{ truenas_data_ip }}:/mnt/pool1_SeagateHDDs/data/audio"
    path: /mnt/media/audio/
  # Jellyfin readonly DOCS
  - src: "{{ truenas_data_ip }}:/mnt/pool1_SeagateHDDs/data/documents"
    path: /mnt/media/documents
  # Jellyfin readonly IMG
  - src: "{{ truenas_data_ip }}:/mnt/pool1_SeagateHDDs/data/images"
    path: /mnt/media/images
  # Jellyfin readonly VID
  - src: "{{ truenas_data_ip }}:/mnt/pool1_SeagateHDDs/data/video"
    path: /mnt/media/video
