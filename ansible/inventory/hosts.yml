---
# Static inventory. Must be kept in sync with the tofu/vm_*.tf definitions
all: # Metagroup. Organizes multiple groups.
  children:
    linux:
      children:

        bare_hosts: # bare systemd services
          hosts:
            debian-03:
              ansible_host: "{{ debian03_ip }}" # put it here for now, will be part of the K8s cluster

        docker_hosts: # docker VMs
          hosts:
            debian-01:
              ansible_host: "{{ debian01_ip }}"
            debian-02:
              ansible_host: "{{ debian02_ip }}"

        k3s_cluster:
          children:
            k3s_server:
              hosts: {}
              # k3s-1:
              #   ansible_host: x.x.x.x
            k3s_agents:
              hosts: {}

    # Provisioned by tofu, but hand-managed.
    windows:
      hosts: {}
