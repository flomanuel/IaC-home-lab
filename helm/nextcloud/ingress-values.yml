# Nextcloud Helm chart values for exposing Nextcloud through a Traefik IngressRoute
ingress:
  enabled: false

nextcloud:
  host: cloud.home.sauers.link
  # Rendered into NEXTCLOUD_TRUSTED_DOMAINS (only applied on first install!)
  trustedDomains:
    - cloud.home.sauers.link
    - cloud.k8s-prod-1.home.sauers.link
  extraEnv:
    # Traefik reaches the pod from the pod network -> trust it so Nextcloud
    # honours X-Forwarded-For / X-Forwarded-Proto. 10.42.0.0/16 = K3s default cluster CIDR.
    - name: TRUSTED_PROXIES
      value: "10.42.0.0/16"
    # Correct URLs in mails/notifications generated by cron/occ
    - name: OVERWRITECLIURL
      value: "https://cloud.home.sauers.link"

# Sets OVERWRITEPROTOCOL=https, so Nextcloud generates https:// links/redirects
# even though Traefik talks plain HTTP to the pod.
phpClientHttpsFix:
  enabled: true
  protocol: https

# Rendered through `tpl`, so chart helpers and .Values are available.
# Resources are created in the release namespace (same as the Service).
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: {{ include "nextcloud.fullname" . }}-dav-redirect
    spec:
      redirectRegex:
        permanent: true
        regex: "https://(.*)/.well-known/(?:card|cal)dav"
        replacement: "https://${1}/remote.php/dav/"
  - |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: nextcloud-ingress-route-certificate
    spec:
      # Secret names are always required.
      secretName: nextcloud-certificate-secret
      issuerRef:
        name: cloudflare-cluster-issuer
        kind: ClusterIssuer
      dnsNames:
        - cloud.k8s-prod-1.home.sauers.link
        - cloud.home.sauers.link
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: {{ include "nextcloud.fullname" . }}-ingressroute
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`cloud.k8s-prod-1.home.sauers.link`) || Host(`cloud.home.sauers.link`)
          kind: Rule
          middlewares:
            - name: {{ include "nextcloud.fullname" . }}-dav-redirect
          services:
            - name: {{ include "nextcloud.fullname" . }}   # the chart's Service
              port: {{ .Values.service.port }}             # 8080 by default
      tls:
        secretName: nextcloud--certificate-secret
